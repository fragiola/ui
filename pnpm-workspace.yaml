packages:
  - "apps/*"
  - "packages/*"
  - "examples/*"
  - "site"
# Dependencies allowed to run install scripts. pnpm 11 refuses an ignored
# build script in CI (ERR_PNPM_IGNORED_BUILDS), which is how the Docker
# build failed while the placeholder string sat here. `allowBuilds` is the
# pnpm 11 key; `onlyBuiltDependencies` was its predecessor.
allowBuilds:
  esbuild: true
  # Pulled in by @tailwindcss/cli for --watch; its prebuilt binaries ship as
  # optional dependencies, so the fallback build script is not needed.
  "@parcel/watcher": false
# pnpm 11 holds back a version younger than its minimum release age (a
# supply-chain guard). Dockable is this organisation's own package, published
# the day the dockable item landed (Epic #66); exact versions, so the guard
# still covers anything else.
minimumReleaseAgeExclude:
  - '@fragiola/dockable-react@0.1.0'
  - '@fragiola/dockable@0.1.0'
verifyDepsBeforeRun: false
