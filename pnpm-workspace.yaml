packages:
  - "apps/*"
  - "packages/*"
  - "examples/*"
  - "site"
# Dependencies allowed to run install scripts. pnpm 11 refuses an ignored
# build script in CI (ERR_PNPM_IGNORED_BUILDS), which is how the Docker
# build failed while the placeholder string sat here. `allowBuilds` is the
# pnpm 11 key; `onlyBuiltDependencies` was its predecessor.
allowBuilds:
  esbuild: true
  # Pulled in by @tailwindcss/cli for --watch; its prebuilt binaries ship as
  # optional dependencies, so the fallback build script is not needed.
  "@parcel/watcher": false
# pnpm 11 holds back a version younger than its minimum release age (a
# supply-chain guard). These are this organisation's own packages, consumed
# by the special items the day they are published (Dockable 0.3.0: Epic #85;
# Splitter 0.1.0: Epic #88; Tree 0.1.0: Epic #91;
# Grid Layout 0.1.0: Epic #94; Data Grid 0.1.0: Epic #98; Primitives 0.3.0, the
# primitives base: Epic #150, bumped by Epic #184); exact versions, so the
# guard still covers anything else.
minimumReleaseAgeExclude:
  - '@fragiola/dockable-react@0.3.0'
  - '@fragiola/dockable@0.3.0'
  - '@fragiola/splitter-react@0.1.0'
  - '@fragiola/splitter@0.1.0'
  - '@fragiola/tree-react@0.1.0'
  - '@fragiola/tree@0.1.0'
  - '@fragiola/grid-layout-react@0.1.0'
  - '@fragiola/grid-layout@0.1.0'
  - '@fragiola/data-grid-react@0.1.0'
  - '@fragiola/data-grid@0.1.0'
  - '@fragiola/primitives-react@0.3.0'
  - '@fragiola/primitives@0.3.0'
verifyDepsBeforeRun: false
