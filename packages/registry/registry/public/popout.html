<!doctype html>
<!-- The host page of Dockable's popout windows (Dockable.Root's popoutURL,
     "popout.html" by default, relative to the page). It stays empty: the
     core copies the page's stylesheets in, adds the content root, and
     Dockable.Popout portals the window's layout into it. Served from your
     project's public/; under a base path, point popoutURL at it. -->
<html>
    <head>
        <meta charset="utf-8" />
        <style>
            body {
                height: 100%;
                margin: 0;
            }
        </style>
    </head>
    <body></body>
</html>
