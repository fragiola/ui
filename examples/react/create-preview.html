<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- An embed page, framed by fragiola.com (contract v1.6 §5). -->
        <meta name="robots" content="noindex" />
        <title>Fragiola UI — Create preview</title>
        <script>
            // Before first paint: the same mapping as src/theme.ts. The
            // preview's scheme is replaced by the design's on the first message.
            (() => {
                const themes = __EXAMPLE_THEMES__;
                const name = new URLSearchParams(location.search).get("theme");
                const theme =
                    themes.find((t) => t.name === name) ||
                    themes.find((t) => t.scheme === "light");
                const root = document.documentElement;
                root.dataset.theme = theme.scheme;
                root.dataset.exampleTheme = theme.name;
                root.classList.toggle("dark", theme.scheme === "dark");
                root.style.colorScheme = theme.scheme;
            })();
        </script>
    </head>
    <body class="palette-surface overflow-hidden bg-palette-base text-palette-contrast">
        <div id="root"></div>
        <script type="module" src="/src/create/preview-main.tsx"></script>
    </body>
</html>
