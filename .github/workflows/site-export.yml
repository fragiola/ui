# The site export (contract v1, fragiola/www CONTRACT.md): fragiola.com
# builds /ui from `pnpm site:export`, so a pull request that breaks the
# export — a broken link, an unknown MDX component, a missing example — fails
# here instead of in the site's deploy.
#
# After a push to main, fragiola/www is told to rebuild with a
# repository_dispatch of type "project-updated". That needs a token allowed
# to dispatch on fragiola/www, stored as the WWW_DISPATCH_TOKEN secret (a
# fine-grained token with Contents: read & write on fragiola/www). Without
# the secret the step is skipped, not failed.

name: Site export

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Builds r/, the embed app and the pages, then validates the output
      # against the contract; any violation exits non-zero.
      - run: pnpm site:export --base /ui --out "$RUNNER_TEMP/site-export"

      # Every example in a real iframe: ready/resize/theme messages, popups
      # that fit their frame, no console errors.
      - run: pnpm --filter examples-react exec playwright install --with-deps chromium
      - run: pnpm --filter examples-react check:embeds

  dispatch:
    needs: export
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      WWW_DISPATCH_TOKEN: ${{ secrets.WWW_DISPATCH_TOKEN }}
    steps:
      - name: Ask fragiola/www to rebuild
        if: env.WWW_DISPATCH_TOKEN != ''
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $WWW_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/fragiola/www/dispatches \
            -d "{\"event_type\":\"project-updated\",\"client_payload\":{\"slug\":\"ui\",\"ref\":\"$GITHUB_SHA\"}}"
